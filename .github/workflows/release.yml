name: Release

# Runs only when a version tag (v1.2.3) is pushed, never on every push to
# main — that is build.yml's job. `workflow_dispatch` builds and uploads the
# artifact from the Actions tab but does NOT publish a GitHub Release (only a
# real tag does).
#
# Two jobs, one per target in `axle.toml`. The Windows job creates the release
# and publishes its archive; the Linux job waits for it, builds on its own
# runner, and adds its archive to the same release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

env:
  # The compiler version these sources need. The MSI serves whatever is
  # current, so the build checks instead of assuming: an older `axle` then
  # fails with one clear line rather than a hundred confusing errors further
  # down.
  AXLE_MIN: '0.18.1'

jobs:
  windows:
    name: Build & release (Windows x86_64)
    runs-on: windows-latest
    steps:
      # Linking this target needs the COFF `axle_stdlib.lib` /
      # `axle_runtime.lib` pair plus the MSVC import libraries the link line
      # asks for. The MSI supplies the first, the runner image the second.
      - name: Install Axle
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'axle.msi'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://dl.axle-lang.dev/latest/axle-windows-x86_64.msi' -OutFile $msi
          $p = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart'
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          # The installer puts itself on PATH, but a step already running does
          # not see that, so resolve the directory and export it. The package
          # is 32-bit, so its breadcrumb lands under WOW6432Node; both keys and
          # both Program Files are tried rather than hard-coding a layout that
          # has already moved once.
          $dir = $null
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Axle', 'HKLM:\SOFTWARE\Axle') {
            if (-not $dir -and (Test-Path $k)) {
              $dir = (Get-ItemProperty $k -Name InstallDir -ErrorAction SilentlyContinue).InstallDir
            }
          }
          foreach ($c in 'C:\Program Files (x86)\Axle', 'C:\Program Files\Axle') {
            if (-not $dir -and (Test-Path (Join-Path $c 'axle.exe'))) { $dir = $c }
          }
          if (-not $dir) { throw 'the MSI installed, but axle.exe was not found' }
          $dir = $dir.TrimEnd('\')
          foreach ($f in 'axle.exe', 'axle_stdlib.lib', 'axle_runtime.lib') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing from $dir" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          # `axle` links a Windows binary by running `lld-link.exe`, which it
          # looks for on PATH and nowhere else. The runner image ships LLVM, so
          # this asserts rather than installs — and if that ever stops being
          # true it says so here, instead of surfacing as a linker error three
          # steps later.
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if (-not $lld) { throw 'lld-link.exe is not on PATH; axle cannot link a Windows binary without it (install LLVM)' }
          "linker: $($lld.Source)"
          # The MSI is whatever is current, so check it instead of assuming.
          $got = (((& (Join-Path $dir 'axle.exe') --version) -split ' ')[1] -split '-')[0]
          if ([version]$got -lt [version]$env:AXLE_MIN) {
            throw "axle $got is older than the required $env:AXLE_MIN"
          }
          "axle $got satisfies >= $env:AXLE_MIN"

      # `submodules: recursive` is not optional: the machine layer is the
      # `vendor/gesso` submodule, the interface is `vendor/zaffre`, and the
      # platform layer under Zaffre is its own `vendor/smalt`. Their src/
      # compile with ours, so a checkout without them leaves the directories
      # empty and `axle build` stops on a missing dependency before it reads
      # any source.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: axle build

      # The package is the binary and nothing else: every library it uses
      # ships with Windows, so there is no DLL to bundle and nothing to
      # install.
      - name: Package
        shell: pwsh
        run: |
          $PKG = 'netaudit-windows-x86_64'
          New-Item -ItemType Directory -Path "dist\$PKG" -Force | Out-Null
          Copy-Item 'target\netaudit.exe' "dist\$PKG\"
          # Which gesso, Zaffre and smalt this binary was built against — the
          # submodule pins, recorded so a release names its own machine layer,
          # interface and platform layer.
          $gesso = (git -C vendor/gesso rev-parse --short HEAD)
          $zaffre = (git -C vendor/zaffre rev-parse --short HEAD)
          $smalt = (git -C vendor/zaffre/vendor/smalt rev-parse --short HEAD)
          @"
          netaudit — what every program on this machine is talking to, in one window.

          Run:  netaudit.exe

          There is nothing to install and nothing needs elevation: iphlpapi,
          dnsapi, kernel32, shell32 and gdi32 ship with Windows, and no DLL is
          bundled because none is needed.

          Built with $(axle --version) against gesso $gesso and Zaffre $zaffre,
          on smalt $smalt. The interface is set in Instrument Sans (SIL Open
          Font License).
          "@ | Set-Content -Encoding utf8 "dist\$PKG\README.txt"
          Compress-Archive -Path "dist\$PKG\*" -DestinationPath "$PKG.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netaudit-windows-x86_64
          path: netaudit-windows-x86_64.zip
          if-no-files-found: error

      # Publish only for real version tags; manual dispatch stops at the
      # uploaded artifact above.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: netaudit-windows-x86_64.zip
          generate_release_notes: true

  linux:
    name: Build & release (Linux x86_64)
    runs-on: ubuntu-latest
    # The Windows job creates the release; this one adds an asset to it.
    needs: windows
    steps:
      - name: Install Axle
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://apt.axle-lang.dev/key.asc | sudo gpg --dearmor -o /etc/apt/keyrings/axle.gpg
          echo "deb [signed-by=/etc/apt/keyrings/axle.gpg arch=amd64] https://apt.axle-lang.dev stable main" \
            | sudo tee /etc/apt/sources.list.d/axle.list
          sudo apt-get update
          sudo apt-get install -y axle

      - name: Check the compiler is new enough
        run: |
          got=$(axle --version | awk '{print $2}' | cut -d- -f1)
          if [ "$(printf '%s\n%s\n' "$AXLE_MIN" "$got" | sort -V | head -n1)" != "$AXLE_MIN" ]; then
            echo "axle $got is older than the required $AXLE_MIN"; exit 1
          fi
          echo "axle $got satisfies >= $AXLE_MIN"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # smalt's X11 backend names `X11` and `asound`; the link line needs their
      # development packages. They are not bundled: a Linux desktop already has
      # the runtime libraries.
      - name: Install the X11 link libraries
        run: sudo apt-get install -y libx11-dev libasound2-dev

      - name: Build
        run: axle build

      # The package is the binary and nothing else, with the sentence that says
      # what this platform can and cannot measure.
      - name: Package
        run: |
          PKG=netaudit-linux-x86_64
          gesso=$(git -C vendor/gesso rev-parse --short HEAD)
          zaffre=$(git -C vendor/zaffre rev-parse --short HEAD)
          smalt=$(git -C vendor/zaffre/vendor/smalt rev-parse --short HEAD)
          mkdir -p "dist/$PKG"
          cp target/netaudit "dist/$PKG/"
          cat > "dist/$PKG/README.txt" <<EOF
          netaudit — what every program on this machine is talking to, in one window.

          Run:  ./netaudit

          Needs libX11 and libasound at run time (a Linux desktop already has
          them); no library is bundled.

          On Linux the DNS badge is off: the system keeps no resolver cache a
          program may read. The ETW badge is off too: per-process byte counts
          need a kernel trace, and this library has no Linux trace yet. Sockets
          whose process is out of sight are grouped by user id; run as root to
          name the processes.

          Built with $(axle --version) against gesso $gesso and Zaffre $zaffre,
          on smalt $smalt. The interface is set in Instrument Sans (SIL Open
          Font License).
          EOF
          tar -czf "$PKG.tar.gz" -C dist "$PKG"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netaudit-linux-x86_64
          path: netaudit-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: netaudit-linux-x86_64.tar.gz
