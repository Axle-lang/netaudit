name: Build

# Every push to main, and every pull request aimed at it.
#
# Two jobs, because `axle.toml` promises two targets. The source tree has no
# port of its own: both builds resolve gesso's ports and smalt's backend, so the
# Linux job is the same `axle build` on another runner, not a second port.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first build pointless; stop it
# rather than pay for both.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The compiler version these sources need. The MSI serves whatever is
  # current, so the build checks instead of assuming: an older `axle` then
  # fails with one clear line rather than a hundred confusing errors further
  # down.
  AXLE_MIN: '0.18.1'

jobs:
  windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      # Install the toolchain before the checkout: it needs no source, and a
      # failure here is about the machine rather than about the commit.
      #
      # There is no apt repo on Windows and nothing to cross-build from
      # either: linking this target needs the COFF `axle_stdlib.lib` /
      # `axle_runtime.lib` pair plus the MSVC import libraries the link line
      # asks for. The MSI supplies the first, the runner image the second.
      - name: Install Axle
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'axle.msi'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://dl.axle-lang.dev/latest/axle-windows-x86_64.msi' -OutFile $msi
          $p = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart'
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          # The installer puts itself on PATH, but a step already running does
          # not see that, so resolve the directory and export it. The package
          # is 32-bit, so its breadcrumb lands under WOW6432Node; both keys and
          # both Program Files are tried rather than hard-coding a layout that
          # has already moved once.
          $dir = $null
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Axle', 'HKLM:\SOFTWARE\Axle') {
            if (-not $dir -and (Test-Path $k)) {
              $dir = (Get-ItemProperty $k -Name InstallDir -ErrorAction SilentlyContinue).InstallDir
            }
          }
          foreach ($c in 'C:\Program Files (x86)\Axle', 'C:\Program Files\Axle') {
            if (-not $dir -and (Test-Path (Join-Path $c 'axle.exe'))) { $dir = $c }
          }
          if (-not $dir) { throw 'the MSI installed, but axle.exe was not found' }
          $dir = $dir.TrimEnd('\')
          foreach ($f in 'axle.exe', 'axle_stdlib.lib', 'axle_runtime.lib') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing from $dir" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          # `axle` links a Windows binary by running `lld-link.exe`, which it
          # looks for on PATH and nowhere else. The runner image ships LLVM, so
          # this asserts rather than installs — and if that ever stops being
          # true it says so here, instead of surfacing as a linker error three
          # steps later.
          $lld = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          if (-not $lld) { throw 'lld-link.exe is not on PATH; axle cannot link a Windows binary without it (install LLVM)' }
          "linker: $($lld.Source)"

      - name: Check the compiler is new enough
        shell: pwsh
        run: |
          $got = (((& axle --version) -split ' ')[1] -split '-')[0]
          if ([version]$got -lt [version]$env:AXLE_MIN) {
            throw "axle $got is older than the required $env:AXLE_MIN"
          }
          "axle $got satisfies >= $env:AXLE_MIN"

      # `submodules: recursive` is not optional: the machine layer is the
      # `vendor/gesso` submodule, the interface is `vendor/zaffre`, and the
      # platform layer under Zaffre is its own `vendor/smalt`. Their src/
      # compiles with ours, so a checkout without them leaves the directories
      # empty and `axle build` stops on a missing dependency before it reads
      # any source.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # One line in the log saying which port this build resolved to, and which
      # seams it found implemented — the answer to "what did it actually
      # compile", recorded where a failed build is read.
      - name: The port this build resolves
        run: axle ports

      - name: Build
        run: axle build

      # The whole package: one binary, no DLL beside it, nothing to install.
      # `if-no-files-found: error` so a build that stops naming its artefact
      # `netaudit.exe` fails here rather than uploading an empty archive.
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: netaudit-windows-x86_64
          path: target/netaudit.exe
          if-no-files-found: error

  linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      # The apt repository is the Linux compiler's distribution channel; the
      # Windows job uses the MSI. Both serve whatever is current, so the same
      # check follows.
      - name: Install Axle
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://apt.axle-lang.dev/key.asc | sudo gpg --dearmor -o /etc/apt/keyrings/axle.gpg
          echo "deb [signed-by=/etc/apt/keyrings/axle.gpg arch=amd64] https://apt.axle-lang.dev stable main" \
            | sudo tee /etc/apt/sources.list.d/axle.list
          sudo apt-get update
          sudo apt-get install -y axle

      - name: Check the compiler is new enough
        run: |
          got=$(axle --version | awk '{print $2}' | cut -d- -f1)
          if [ "$(printf '%s\n%s\n' "$AXLE_MIN" "$got" | sort -V | head -n1)" != "$AXLE_MIN" ]; then
            echo "axle $got is older than the required $AXLE_MIN"; exit 1
          fi
          echo "axle $got satisfies >= $AXLE_MIN"

      # `submodules: recursive` brings gesso and Zaffre, and smalt under
      # Zaffre; their src/ compiles with ours.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # smalt's X11 backend names `X11` and `asound` in its own extern blocks,
      # so the link line needs the development packages even though nothing in
      # this repository names them. The Wayland backend would need
      # `libwayland-dev` instead; X11 is the default and runs under Xwayland.
      - name: Install the X11 link libraries
        run: |
          sudo apt-get install -y libx11-dev libasound2-dev

      - name: The port this build resolves
        run: axle ports

      - name: Build
        run: axle build

      # On Linux the artefact has no extension. `if-no-files-found: error` so a
      # build that stops naming it `netaudit` fails here.
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: netaudit-linux-x86_64
          path: target/netaudit
          if-no-files-found: error
